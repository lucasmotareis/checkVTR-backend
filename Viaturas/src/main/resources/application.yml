spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/frotapm
    username: frotapm
    password: 123456
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dochecksolucoes@gmail.com}
    password: ${MAIL_PASSWORD:htatleozwggjueey}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

auth:
  password-reset:
    reset-url-base: ${PASSWORD_RESET_URL_BASE:https://localhost:3000/reset-password}
    from-email: ${PASSWORD_RESET_FROM_EMAIL:no-reply@docheck.local}
  email-verification:
    verify-url-base: ${EMAIL_VERIFICATION_URL_BASE:https://localhost:3000/verify-email}
    from-email: ${EMAIL_VERIFICATION_FROM_EMAIL:no-reply@docheck.local}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,https://localhost:3000,https://api.pmto8bpm.com.br,http://10.0.2.2:3000,http://localhost:8081,http://192.168.10.101:8081,https://frota.pmto8bpm.com.br,https://web.pmto8bpm.com.br}

storage:
  s3:
    region: ${S3_REGION:sa-east-1}
    checklist-bucket: ${S3_CHECKLIST_BUCKET:fotos-viaturas}
    profile-bucket: ${S3_PROFILE_BUCKET:usuarios-perfil}
    key-prefix: ${S3_KEY_PREFIX:}

jwt:
  secret: ${JWT_SECRET}
