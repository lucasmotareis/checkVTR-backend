# Perfil dedicado. O Compose desta branch ativa homolog explicitamente.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/frotapm_homolog}
    username: ${POSTGRES_USER:frotapm_homolog}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://homolog_app.pmto8bpm.com.br,https://homolog_front.pmto8bpm.com.br,https://homolog_back.pmto8bpm.com.br}

storage:
  s3:
    checklist-bucket: ${S3_CHECKLIST_BUCKET:homolog-fotos-viaturas}
    profile-bucket: ${S3_PROFILE_BUCKET:homolog-fotos-viaturas}
    isolated: true
    key-prefix: ${S3_KEY_PREFIX:homolog}

auth:
  password-reset:
    reset-url-base: ${PASSWORD_RESET_URL_BASE:https://homolog_front.pmto8bpm.com.br/reset-password}
  email-verification:
    verify-url-base: ${EMAIL_VERIFICATION_URL_BASE:https://homolog_front.pmto8bpm.com.br/verify-email}

jwt:
  secret: ${JWT_SECRET}
