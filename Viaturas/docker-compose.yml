services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker,homolog
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-frotapm_homolog}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-frotapm_homolog}
      POSTGRES_USER: ${POSTGRES_USER:-frotapm_homolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-https://homolog_front.pmto8bpm.com.br/reset-password}
      PASSWORD_RESET_FROM_EMAIL: ${PASSWORD_RESET_FROM_EMAIL:-no-reply@docheck.local}
      EMAIL_VERIFICATION_URL_BASE: ${EMAIL_VERIFICATION_URL_BASE:-https://homolog_front.pmto8bpm.com.br/verify-email}
      EMAIL_VERIFICATION_FROM_EMAIL: ${EMAIL_VERIFICATION_FROM_EMAIL:-no-reply@docheck.local}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_REGION: ${S3_REGION:-sa-east-1}
      S3_CHECKLIST_BUCKET: ${S3_CHECKLIST_BUCKET:-homolog-fotos-viaturas}
      S3_PROFILE_BUCKET: ${S3_PROFILE_BUCKET:-homolog-fotos-viaturas}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-homolog}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://homolog_app.pmto8bpm.com.br,https://homolog_front.pmto8bpm.com.br,https://homolog_back.pmto8bpm.com.br}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-frotapm-api-homolog}.rule=Host(`${API_HOST:-homolog_back.pmto8bpm.com.br}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-frotapm-api-homolog}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-frotapm-api-homolog}.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-frotapm-api-homolog}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-frotapm-api-homolog}.service=${TRAEFIK_SERVICE_NAME:-frotapm-api-homolog}"
      - "traefik.http.services.${TRAEFIK_SERVICE_NAME:-frotapm-api-homolog}.loadbalancer.server.port=8080"

  db:
    image: postgres:15
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frotapm_homolog}
      POSTGRES_USER: ${POSTGRES_USER:-frotapm_homolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-homolog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-homolog-data:
